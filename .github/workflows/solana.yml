name: solana program

# Builds and tests the Anchor program on every push that touches it. This is
# the build machine for anyone without a Linux toolchain: push the branch, and
# the log below says whether the program compiles and whether the handbook
# still holds as assertions.
on:
  push:
    branches: [main, solana]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  program:
    name: build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/solana
    steps:
      - uses: actions/checkout@v4

      # The official one-liner: Rust, the Solana CLI (Agave), AVM and Anchor.
      - name: Install Rust, Solana CLI and Anchor
        working-directory: .
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL https://solana-install.solana.workers.dev | bash
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          echo "$HOME/.avm/bin" >> "$GITHUB_PATH"

      # Pin Anchor to the version Anchor.toml and Cargo.toml ask for, whatever
      # the installer considers latest today.
      - name: Pin Anchor 1.2.0
        run: |
          avm install 1.2.0 || true
          avm use 1.2.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend/solana

      - name: Versions
        run: |
          rustc --version
          solana --version
          anchor --version

      # Pure arithmetic first: fee, maintenance, both liquidation distances,
      # the payout cap and funding. Fast, and independent of the validator.
      - name: Math unit tests
        run: cargo test -p vevo --lib

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install JS dependencies
        run: yarn install

      # A throwaway wallet for the local validator. Worthless and discarded.
      - name: Local wallet
        run: solana-keygen new --no-bip39-passphrase --silent --force -o "$HOME/.config/solana/id.json"

      # The first build creates target/deploy/vevo-keypair.json; `keys sync`
      # then points declare_id! and Anchor.toml at it, and the second build
      # bakes that address in.
      # The release build: the program id committed in lib.rs / Anchor.toml
      # (the address of the operator's own program keypair, which never leaves
      # their machine). Anchor gives the IDL and types; `cargo build-sbf` gives
      # the deployable SBPF v0 binary (Anchor 1.2's own .so is SBPF v3, which
      # the clusters reject).
      - name: Release build (committed program id)
        run: |
          anchor build
          cargo build-sbf --manifest-path programs/vevo/Cargo.toml --sbf-out-dir target/deploy
          mkdir -p "$RUNNER_TEMP/release"
          cp target/deploy/vevo.so target/idl/vevo.json target/types/vevo.ts "$RUNNER_TEMP/release/"
          grep -o 'declare_id!("[^"]*")' programs/vevo/src/lib.rs | tee "$RUNNER_TEMP/release/PROGRAM_ID.txt"
          sha256sum "$RUNNER_TEMP/release/vevo.so" | tee "$RUNNER_TEMP/release/SHA256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: vevo-program
          path: ${{ runner.temp }}/release
          retention-days: 30

      # The test build: a throwaway program keypair, synced in, so the test
      # validator can deploy it through the upgradeable loader like devnet does.
      - name: Build
        run: |
          anchor keys sync
          anchor build

      - name: Build SBF binary
        run: cargo build-sbf --manifest-path programs/vevo/Cargo.toml --sbf-out-dir target/deploy

      # The program is deployed the way it will be on devnet: through the
      # upgradeable loader, with this wallet as upgrade authority. `initialize`
      # checks exactly that, so a genesis-loaded program would not do.
      - name: Local validator and deploy
        run: |
          solana config set --url http://127.0.0.1:8899
          solana-test-validator --reset --quiet --ledger "$RUNNER_TEMP/ledger" > "$RUNNER_TEMP/validator.log" 2>&1 &
          for i in $(seq 1 60); do
            solana cluster-version >/dev/null 2>&1 && break
            sleep 1
          done
          solana cluster-version
          solana balance
          solana program deploy target/deploy/vevo.so --program-id target/deploy/vevo-keypair.json
          # A freshly deployed program becomes callable one slot later.
          sleep 3
          solana program show "$(solana-keygen pubkey target/deploy/vevo-keypair.json)"

      - name: Test
        env:
          ANCHOR_PROVIDER_URL: http://127.0.0.1:8899
          ANCHOR_WALLET: /home/runner/.config/solana/id.json
          NODE_OPTIONS: --no-experimental-strip-types
        run: yarn run ts-mocha -p ./tsconfig.json -t 1000000 'tests/**/*.ts'

      - name: Validator log (on failure)
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/validator.log" || true

  # The site against the Solana chain layer: lint, types, and a production
  # build in the preview state (no program configured), as a fresh clone gets.
  site:
    name: site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npx --yes yarn@1.22.22 install
      - name: Lint
        run: npx yarn@1.22.22 lint
      - name: Types
        run: npx tsc --noEmit
      - name: Build
        run: npx yarn@1.22.22 build

  keeper:
    name: keeper (solana)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/keeper-solana
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
