[toolchain]
anchor_version = "1.2.0"

[features]
resolution = true
skip-lint = false

# `anchor keys sync` rewrites these and `declare_id!` in lib.rs to the address
# of target/deploy/vevo-keypair.json. Keep that keypair: it IS the program
# address. Never commit it (see .gitignore).
[programs.localnet]
vevo = "Fg6PaFpoGXkYsidMpWTK6W2BeZ7FEfcYkg476zPFsLnS"

[programs.devnet]
vevo = "Fg6PaFpoGXkYsidMpWTK6W2BeZ7FEfcYkg476zPFsLnS"

[programs.mainnet]
vevo = "Fg6PaFpoGXkYsidMpWTK6W2BeZ7FEfcYkg476zPFsLnS"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
