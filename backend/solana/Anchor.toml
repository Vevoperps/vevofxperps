[toolchain]
anchor_version = "1.2.0"

[features]
resolution = true
skip-lint = false

# `anchor keys sync` rewrites these and `declare_id!` in lib.rs to the address
# of target/deploy/vevo-keypair.json. Keep that keypair: it IS the program
# address. Never commit it (see .gitignore).
[programs.localnet]
vevo = "2XbvCuDYXCUw4cuBs7ngsg4k6Trr6HuUUvPJ29R27sMo"

[programs.devnet]
vevo = "2XbvCuDYXCUw4cuBs7ngsg4k6Trr6HuUUvPJ29R27sMo"

[programs.mainnet]
vevo = "2XbvCuDYXCUw4cuBs7ngsg4k6Trr6HuUUvPJ29R27sMo"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "NODE_OPTIONS=--no-experimental-strip-types yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
