[package]
name = "vevo"
version = "0.1.0"
description = "vevo: perpetual futures on the world's currencies, settled in USDC"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "vevo"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = { version = "1.2.0", features = ["init-if-needed"] }
# Only the token interface (classic SPL Token, and Token-2022 through the same
# CPI). The default features pull in Token-2022 extensions, ATA and metadata
# code the program never calls, and every byte of the binary costs rent.
anchor-spl = { version = "1.2.0", default-features = false, features = ["token", "token_2022"] }
# `#[account(zero_copy)]` expands to `::bytemuck` paths, so the crate has to be
# a direct dependency. `min_const_generics` lets the 80-slot marks array be Pod.
bytemuck = { version = "1.25", features = ["derive", "min_const_generics"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
